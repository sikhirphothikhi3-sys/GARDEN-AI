<!DOCTYPE html>
<html lang="th">


<head>


    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <title>GARDEN AI | ผู้ช่วยเรื่องพรรณไม้</title>


    <link
        rel="stylesheet"
        href="style.css"
    >


</head>


<body>


    <main class="chat-page">


        <div class="chat-container">


            <div class="chat-header">


                <div class="chat-logo">
                    🌿
                </div>


                <div>


                    <h1>
                        GARDEN AI
                    </h1>


                    <p>
                        ผู้ช่วยอัจฉริยะด้านพรรณไม้
                    </p>


                </div>


            </div>


            <div
                id="chatMessages"
                class="chat-messages"
            >


                <div class="message ai-message">


                    <div class="message-icon">
                        🤖
                    </div>


                    <div class="message-text">


                        สวัสดีครับ 👋


                        <br><br>


                        ผมคือ <strong>GARDEN AI</strong>


                        <br><br>


                        ผมสามารถช่วยตอบคำถามเกี่ยวกับ
                        ชื่อสามัญ ชื่อวิทยาศาสตร์ ชื่อวงศ์
                        และการขยายพันธุ์ของพรรณไม้ได้ครับ 🌿


                    </div>


                </div>


            </div>


            <div class="suggestions">


                <button
                    onclick="askQuestion('ข้อมูลเกี่ยวกับสิบสองปันนา?')"
                >
                    🌿 ข้อมูลพรรณไม้สิบสองปันนา
                </button>


                <button
                    onclick="askQuestion('ข้อมูลเกี่ยวกับพุดซ้อน?')"
                >
                    🌱 ข้อมูลพรรณไม้พุดซ้อน
                </button>


                <button
                    onclick="askQuestion('ข้อมูลปาล์มหางกระรอก?')"
                >
                    🎨 ข้อมูลพรรณไม้ปาล์มหางกระรอก
                </button>


                <button
                    onclick="askQuestion('ข้อมูลทองอุไร?')"
                >
                    🎨 ข้อมูลพรรณไม้ทองอุไร
                </button>


            </div>


            <div class="chat-input-area">


                <input
                    type="text"
                    id="userInput"
                    placeholder="พิมพ์คำถามเกี่ยวกับพรรณไม้..."
                    onkeydown="handleEnter(event)"
                >


                <button
                    onclick="sendMessage()"
                >
                    ➤
                </button>


            </div>


            <a
                href="index.html"
                class="back-home"
            >
                ← กลับหน้าหลัก
            </a>


        </div>


    </main>


    <script>


        // ====================================
        // GARDEN AI CHAT
        // ====================================


        function addMessage(
            message,
            type
        ) {


            const container =
                document.getElementById(
                    "chatMessages"
                );


            const messageDiv =
                document.createElement(
                    "div"
                );


            messageDiv.className =
                "message " +
                type +
                "-message";


            const icon =
                type === "ai"
                ? "🤖"
                : "👤";


            messageDiv.innerHTML = `


                <div class="message-icon">
                    ${icon}
                </div>


                <div class="message-text">
                    ${message}
                </div>


            `;


            container.appendChild(
                messageDiv
            );


            container.scrollTop =
                container.scrollHeight;


        }


        function sendMessage() {


            const input =
                document.getElementById(
                    "userInput"
                );


            const question =
                input.value.trim();


            if (!question) {
                return;
            }


            addMessage(
                question,
                "user"
            );


            input.value = "";


            setTimeout(
                function() {


                    const answer =
                        getGARDENAnswer(
                            question
                        );


                    addMessage(
                        answer,
                        "ai"
                    );


                },
                500
            );


        }


        function askQuestion(
            question
        ) {


            document.getElementById(
                "userInput"
            ).value = question;


            sendMessage();


        }


        function handleEnter(event) {


            if (
                event.key === "Enter"
            ) {


                sendMessage();


            }


        }


        // ====================================
        // ฐานความรู้ GARDEN AI
        // ====================================


        function getGARDENAnswer(
            question
        ) {


            const q =
                question.toLowerCase();


            if (
                q.includes("สิบสองปันนา") ||
                q.includes("สิบสองปันนา") 
            ) {


                return `
                    🌿 <strong>สิบสองปันนา</strong>
                    <br><br>
•   ชื่อสามัญ: สิบสองปันนา (ชื่อภาษาอังกฤษ: Pygmy Date Palm, Miniature Date Palm)
•   ชื่อวิทยาศาสตร์: Phoenix roebelenii O'Brien
•   ชื่อวงศ์: ARECACEAE (วงศ์ปาล์ม)
การขยายพันธุ์
สิบสองปันนาสามารถขยายพันธุ์ได้ 2 วิธีหลัก:
1.  การเพาะเมล็ด (นิยมที่สุด):
o   นำเมล็ดสุกที่ล้างเนื้อออกสะอาดแล้วไปแช่น้ำไว้ประมาณ 1–2 วัน
o   นำไปเพาะในขุยมะพร้าวผสมทรายหรือดินร่ามซุย รดน้ำให้ชื้นแต่อย่าให้แฉะ
o   ใช้เวลาในการงอกประมาณ 1–3 เดือน
2.  การแยกหน่อ:
o   หากต้นแม่มีการแตกหน่อบริเวณโคนต้น สามารถขุดแยกหน่อที่มีรากติดมาด้วยนำไปปลูกลงกระถางหรือแปลงปลูกใหม่ได้
                    <br><br>
                    💡 GARDEN AI สามารถช่วยวิเคราะห์
                    ภาพพรรณไม้เพื่อใช้เป็นข้อมูล
                    ประกอบการตัดสินใจได้ครับ
                `;


            }


            if (
                q.includes("พุดซ้อน") ||
                q.includes("พุดซ้อน")
            ) {


                return `
                    🌱 <strong>พุดซ้อน</strong>
                    <br><br>
•   ชื่อสามัญ: พุดซ้อน, พุดจีน (ชื่อภาษาอังกฤษ: Cape Jasmine, Gardenia)
•   ชื่อวิทยาศาสตร์: Gardenia jasminoides J.Ellis (ชื่อพ้อง: Gardenia augusta)
•   ชื่อวงศ์: RUBIACEAE (วงศ์เข็ม)
การขยายพันธุ์
พุดซ้อนสามารถขยายพันธุ์ได้หลายวิธี โดยวิธีที่นิยมมากที่สุดคือการปักชำและการตอนกิ่ง:
1.  การปักชำ (นิยมและสะดวกที่สุด):
o   คัดเลือกกิ่งกึ่งแก่กึ่งอ่อน (ไม่อ่อนเกินไปและไม่แข็งเป็นไม้เนื้อแข็ง) ความยาวประมาณ 10–15 เซนติเมตร
o   ตัดใบส่วนล่างออก ให้เหลือใบด้านบนไว้เล็กน้อยเพื่อลดการคายน้ำ
o   นำไปปักลงในวัสดุปลูกที่ระบายน้ำและอากาศได้ดี เช่น ขุยมะพร้าวผสมทราย หรือดินร่าม
o   รดน้ำให้ชื้น นำไปวางในที่ร่มรำไร ประมาณ 3–4 สัปดาห์จะเริ่มแตกราก
2.  การตอนกิ่ง:
o   เลือกกิ่งที่สมบูรณ์ ควั่นเปลือกกิ่งรอบกิ่งความยาวประมาณ 1 นิ้ว แล้วขูดเมือกออก
o   ทายาเร่งราก นำหุ้มด้วยขุยมะพร้าวชุ่มน้ำ แล้วรัดด้วยถุงพลาสติกให้แน่น
o   รอจนรากงอกเต็มถุง (ประมาณ 1 เดือน) จึงตัดนำไปปลูกลงกระถางหรือแปลงปลูก
3.  การทาบกิ่ง / เพาะเมล็ด:
o   การเพาะเมล็ดไม่ค่อยเป็นที่นิยมเนื่องจากพุดซ้อนสายพันธุ์ติดผลยาก และใช้เวลานานกว่าจะออกดอก
                `;


            }


            if (
                q.includes("ปาล์มหางกระรอก") ||
                q.includes("ปาล์มหางกระรอก")
            ) {


                return `
                    🎨 <strong>ปาล์มหางกระรอก</strong>
                    <br><br>
•   ชื่อสามัญ: ปาล์มหางกระรอก, ปาล์มฟอกเทล (ชื่อภาษาอังกฤษ: Foxtail Palm) 
•   ชื่อวิทยาศาสตร์: Wodyetia bifurcata A.K.Irvine 
•   ชื่อวงศ์: ARECACEAE (วงศ์ปาล์ม) 
การขยายพันธุ์
ปาล์มหางกระรอกเป็นปาล์มลำต้นเดี่ยว (ไม่แตกหน่อ) จึงขยายพันธุ์ด้วย การเพาะเมล็ด เป็นหลัก: 
1.  การคัดเลือกเมล็ด: 
o   ใช้เมล็ดจากผลที่สุกแก่เต็มที่ (ผลจะเปลี่ยนเป็นสีส้มหรือสีแดงสด)
2.  การเตรียมเมล็ด:
o   นำผลสุกมาปอกหรือขูดเปลือกและเนื้อนุ่มด้านนอกออกให้เหลือแต่กะลาเมล็ดแข็ง
o   ล้างเนื้อออกให้สะอาดเพื่อป้องกันเชื้อราและมดแมลงมารบกวน
o   นำเมล็ดไปแช่น้ำไว้ประมาณ 3–7 วัน (เปลี่ยนน้ำทุกวัน) เพื่อช่วยกระตุ้นให้เปลือกเมล็ดนิ่มลงและงอกได้ไวขึ้น
3.  ขั้นตอนการเพาะ:
o   นำเมล็ดไปเพาะลงในวัสดุปลูกที่ระบายน้ำและเก็บความชื้นได้ดี เช่น ขุยมะพร้าวผสมทราย หรือขุยมะพร้าวผสมเป้าท์มอส
o   ฝังเมล็ดลงไปในแนวระดับ ให้กลบวัสดุปลูกพอท่วมเมล็ดเล็กน้อย
o   รดน้ำให้ชุ่มแต่อย่าให้แฉะเกินไป แล้วนำไปวางไว้ในที่ร่มรำไร หรือใช้ถุงพลาสติกอบความชื้นไว้
o   เมล็ดจะใช้เวลาในการงอกประมาณ 1–3 เดือน ขึ้นอยู่กับความสดของเมล็ดและความชื้น
                `;


            }


            if (
                q.includes("ทองอุไร") ||
                q.includes("ทองอุไร")
            ) {


                return `
                    🎨 <strong>ทองอุไร</strong>
                    <br><br>
•   ชื่อสามัญ: ทองอุไร (ชื่อภาษาอังกฤษ: Yellow Elder, Yellow Bells, Yellow Trumpet, Esperanza)
•   ชื่อวิทยาศาสตร์: Tecoma stans (L.) Juss. ex Kunth
•   ชื่อวงศ์: BIGNONIACEAE (วงศ์แคอังศุมาลี / วงศ์ทองอุไร)
การขยายพันธุ์
ทองอุไรเป็นไม้โตเร็วที่โตง่ายและออกดอกตลอดปี ขยายพันธุ์ได้ 3 วิธีหลัก:
1.  การปักชำ (นิยมและเห็นผลไวที่สุด):
o   เลือกกิ่งกึ่งแก่กึ่งอ่อน ความยาวประมาณ 15–20 เซนติเมตร
o   ตัดใบส่วนล่างออก เหลือใบยอดไว้เล็กน้อย
o   ปักชำลงในขุยมะพร้าวผสมทรายหรือดินร่ามที่ระบายน้ำได้ดี
o   รดน้ำให้ชื้นและเก็บในที่ร่มรำไร ประมาณ 2–3 สัปดาห์จะเริ่มออกราก
2.  การเพาะเมล็ด:
o   นำฝักแก่แห้งที่เป็นสีน้ำตาลมาแกะเอาเมล็ดข้างใน (เมล็ดมีลักษณะเป็นแผ่นบางๆ มีปีก)
o   นำไปโรยลงบนดินเพาะกล้า แล้วกลบดินบางๆ
o   รดน้ำให้ชุ่ม เมล็ดจะงอกภายใน 1–2 สัปดาห์
3.  การตอนกิ่ง:
o   เลือกกิ่งที่สมบูรณ์ ควั่นเปลือกกิ่งแล้วหุ้มด้วยขุยมะพร้าวชุ่มน้ำ
o   รอกระทั่งรากงอกเต็มถุงพลาสติก (ประมาณ 3–4 สัปดาห์) จึงตัดไปปลูก
                `;


            }



            if (
                q.includes("ai") ||
                q.includes("ปัญญาประดิษฐ์")
            ) {


                return `
                    🤖 <strong>GARDEN AI คืออะไร?</strong>
                    <br><br>
                    GARDEN AI เป็นระบบต้นแบบที่นำ
                    ปัญญาประดิษฐ์มาประยุกต์ใช้กับ
                    ข้อมูลพรรณไม้
                    <br><br>
                    ระบบสามารถวิเคราะห์ภาพพรรณไม้
                    และให้ข้อมูลความมั่นใจของโมเดล
                    รวมถึงมีผู้ช่วยตอบคำถาม
                    เกี่ยวกับองค์ความรู้ของพรรณไม้ครับ
                `;


            }


            return `
                🤖 ผมยังไม่มีข้อมูลเกี่ยวกับคำถามนี้
                ในฐานความรู้ของ GARDEN AI ครับ
                <br><br>
                ลองถามเกี่ยวกับ
                <strong>สิบสองปันนา</strong>,
                <strong>พุดซ้อน</strong>,
                <strong>ปาล์มหางกระรอก</strong>
                หรือ
                <strong>ทองอุไร</strong>
                ดูนะครับ 🌿
            `;


        }


    </script>


</body>


</html>
